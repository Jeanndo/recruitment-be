[project]
name = "backend"
version = "0.1.0"
description = "Brightcore Techology e-Recruitement-APIs"
readme = "README.md"
authors = [
    { name = "Jeanndo", email = "jeanndo.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.159.1",
    "itsdangerous>=2.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
backend = "backend:main"
seed = "backend.seed:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
